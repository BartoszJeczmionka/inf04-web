<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Wizytowka PD</title>
</head>
<body>
    <header>
        <img src="https://img.magnific.com/darmowe-wektory/niebieski-gradient-uzytkownika_78370-4692.jpg?semt=ais_hybrid&w=740&q=80" alt="Awatar">
        <div id="dane">
            <h1>Piotr Dziemieńczuk</h1>
            <h3>Klasa 5p1T</h3>
        </div>
    </header>
    <main>
        <section id="o_mnie">
            <h2>O mnie: </h2>
            <hr>
            <ul>
                <li>
                    Uwielbiam grać na instrumentach muzycznych i próbować pisać działający kod
                </li>
            </ul>
          </section>

        <section id="umiejetnosci">
        <h2>Umiejętności: </h2>
        <hr>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>PHP</li>
                <li>JAVASCRIPT</li>
            </ul>
        </section>
        <section id="kontakt">
        <h2>Kontakt: </h2>
        <hr>
        <form id="formularz" novalidate>
            <div class="pole">
                <label for="imie">Imie: </label>
                <input type="text" name="imie" id="imie">
                <p class="blad" id="blad_imie"></p>
            </div>

            <div class="pole">
                <label for="email">E-mail: </label>
                <input type="email" name="email" id="email">
                <p class="blad" id="blad_email"></p>
            </div>

            <div class="pole">
                <label for="temat">Temat: </label>
                <select name="temat" id="temat">
                    <option value="">— wybierz temat —</option>
                    <option value="1">Opcja 1</option>
                    <option value="2">Opcja 2</option>
                    <option value="3">Opcja 3</option>
                </select>
                <p class="blad" id="blad_temat"></p>
            </div>

            <div class="pole">
                <label for="wiadomosc">Wiadomość: </label>
                <textarea name="wiadomosc" id="wiadomosc" rows="5"></textarea>
                <p class="blad" id="blad_wiadomosc"></p>
            </div>
            <button type="submit">Wyślij</button>
        </form>   

        <div id="podziekowanie" class="podziekowanie" hidden>
            <h3>Dziękuję za wiadomość!</h3>
            <p id="podziekowanie_tresc"></p>
          </div>  

        </section>
    </main>
    <footer>
        <p>
          Piotr Dziemieńczuk ·
          <a href="https://github.com/piotrdziemienczuk/inf04-web">GitHub</a> ·
          <a href="mailto:piotr.d@example.com">piotr.d@example.com</a>
        </p>
      </footer>
    
      <script src="main.js"></script>
</body>
</html>
